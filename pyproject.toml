[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palomar-reviewer"
version = "0.1.0"
description = "Operator-run editorial reviewer for Palomar submissions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "ruff==0.16.2",
]
artifact = [
  "hatchling==1.31.0",
]

[project.scripts]
palomar-review = "palomar_reviewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/palomar_reviewer"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
