name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: reviewer
      # PalomarDatabase is private. Public CI checks the schema contract from
      # its authoritative public source repository without granting a
      # cross-repository credential. The full registration
      # integration runs against a committed synthetic database in public
      # PalomarDatabaseTools CI, which needs no credential or private ledger
      # bytes. That is stated
      # here as `PALOMAR_TESTS_WITHOUT: database` below, and the suite fails
      # under CI on any capability that is neither available nor named there.
      # "Maintainers run it locally" was the previous answer and it was not
      # true: nothing ran it, and it was red.
      #
      # A registered record has one current public contract: schema-v3.json.
      # `scores-v1.json` is not fetched because it is not published: the
      # database validates `scores/` itself, at registration.
      # The custom domain, not the workers.dev name. That second hostname is
      # being turned off: it was a whole second front door onto the production
      # bucket, outside anything scoped to the zone and able to lag the Worker's
      # path allowlist indefinitely. This is the origin readers use.
      - name: Download the schema a record is built against
        env:
          PUBLIC_CONTRACT_ORIGIN: https://raw.githubusercontent.com/PalomarRegistry/PalomarDatabaseTools/main
        run: |
          mkdir palomar-schemas
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_CONTRACT_ORIGIN/schema-v3.json" \
            --output palomar-schemas/schema-v3.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarPolicy
          persist-credentials: false
          path: palomar-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Lint
        working-directory: reviewer
        run: uv run --isolated --python 3.11.10 --locked --only-group dev ruff check .
      - name: Reproduce the promoted runtime artifact
        working-directory: reviewer
        run: python3 tools/runtime_artifact.py --check
      - name: Cold-install the promoted runtime artifact
        working-directory: reviewer
        run: |
          set -euo pipefail
          runtime_env="$RUNNER_TEMP/palomar-reviewer-runtime"
          codex_runtime="$RUNNER_TEMP/palomar-codex-runtime"
          uv venv --no-project --python 3.11.10 --no-managed-python "$runtime_env"
          (cd runtime && sha256sum --check SHA256SUMS)
          (cd runtime && uv pip install --python "$runtime_env/bin/python" \
            --require-hashes --no-deps --only-binary :all: \
            --no-cache --no-config -r requirements.txt)
          uv pip install --python "$runtime_env/bin/python" --no-deps --no-index \
            --no-cache --no-config runtime/palomar_reviewer-0.1.0-py3-none-any.whl
          uv pip check --python "$runtime_env/bin/python"
          "$runtime_env/bin/palomar-review" --help >/dev/null
          "$runtime_env/bin/palomar-review" auto --help >/dev/null
          "$runtime_env/bin/palomar-review" rebuild-queue --help >/dev/null
          "$runtime_env/bin/palomar-review" doctor --help >/dev/null
          "$runtime_env/bin/palomar-review" star-registered --help >/dev/null
          mkdir -m 700 "$codex_runtime"
          install -m 0644 runtime/codex-package.json "$codex_runtime/package.json"
          install -m 0644 runtime/codex-package-lock.json "$codex_runtime/package-lock.json"
          npm ci --prefix "$codex_runtime" --ignore-scripts --no-audit --no-fund \
            --cache "$RUNNER_TEMP/palomar-codex-npm-cache"
          [ "$("$codex_runtime/node_modules/.bin/codex" --version)" = \
            "codex-cli 0.147.0" ]
          printf '%s\n' "$codex_runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install
        working-directory: reviewer
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Codex was installed from the promoted, integrity-locked artifact in
          # the previous step. The provider wiring and broker allowlist are
          # tested only against those exact wrapper and Linux binary bytes.
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces by
          # default even on the disposable hosted runner. Enable them here so
          # the fail-closed namespace integration test exercises real bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install --disable-pip-version-check -e .
      - name: Compile and test
        working-directory: reviewer
        env:
          PALOMAR_SCHEMA_CHECKOUT: ${{ github.workspace }}/palomar-schemas
          PALOMAR_POLICY_CHECKOUT: ${{ github.workspace }}/palomar-policy
          # Everything this job cannot do, written down. Anything else the
          # suite reaches for and does not find fails the run rather than
          # quietly disappearing, so renaming either variable above, or
          # breaking the bubblewrap install, turns red here instead of
          # removing the coverage in silence.
          PALOMAR_TESTS_WITHOUT: database
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: reviewer
        run: palomar-review --help >/dev/null
