name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: reviewer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarDatabase
          persist-credentials: false
          path: palomar-database
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarPolicy
          persist-credentials: false
          path: palomar-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install
        working-directory: reviewer
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces by
          # default even on the disposable hosted runner. Enable them here so
          # the fail-closed namespace integration test exercises real bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install --disable-pip-version-check -e .
      - name: Compile and test
        working-directory: reviewer
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/palomar-database
          PALOMAR_POLICY_CHECKOUT: ${{ github.workspace }}/palomar-policy
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: reviewer
        run: palomar-review --help >/dev/null
