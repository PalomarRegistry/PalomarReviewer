name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: reviewer
      # PalomarDatabase is private. Public CI checks the schema contract
      # without granting a cross-repository credential. The full registration
      # integration, which needs a PalomarDatabase checkout to register into,
      # runs in PalomarDatabase itself: see `.github/workflows/reviewer-contract.yml`
      # there, which checks this repository out rather than the other way
      # round and so needs no credential for anything private. That is stated
      # here as `PALOMAR_TESTS_WITHOUT: database` below, and the suite fails
      # under CI on any capability that is neither available nor named there.
      # "Maintainers run it locally" was the previous answer and it was not
      # true: nothing ran it, and it was red.
      #
      # A registered record has one current public contract: schema-v2.json.
      # `scores-v1.json` is not fetched because it is not published: the
      # database validates `scores/` itself, at registration.
      # The custom domain, not the workers.dev name. That second hostname is
      # being turned off: it was a whole second front door onto the production
      # bucket, outside anything scoped to the zone and able to lag the Worker's
      # path allowlist indefinitely. This is the origin readers use.
      - name: Download the schema a record is built against
        env:
          PUBLIC_DATA_ORIGIN: https://data.palomar-registry.org
        run: |
          mkdir palomar-schemas
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v2.json" \
            --output palomar-schemas/schema-v2.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarPolicy
          persist-credentials: false
          path: palomar-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Lint
        working-directory: reviewer
        run: uv run --locked --only-group dev ruff check .
      - name: Install
        working-directory: reviewer
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces by
          # default even on the disposable hosted runner. Enable them here so
          # the fail-closed namespace integration test exercises real bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install --disable-pip-version-check -e .
      - name: Compile and test
        working-directory: reviewer
        env:
          PALOMAR_SCHEMA_CHECKOUT: ${{ github.workspace }}/palomar-schemas
          PALOMAR_POLICY_CHECKOUT: ${{ github.workspace }}/palomar-policy
          # Everything this job cannot do, written down. Anything else the
          # suite reaches for and does not find fails the run rather than
          # quietly disappearing, so renaming either variable above, or
          # breaking the bubblewrap install, turns red here instead of
          # removing the coverage in silence.
          PALOMAR_TESTS_WITHOUT: database
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: reviewer
        run: palomar-review --help >/dev/null
